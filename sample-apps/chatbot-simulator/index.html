<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ChatBot Privado — Simulador</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Helvetica, sans-serif; }

    body {
      background: #e5ddd5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* ── Ventana del chat ── */
    .chat-window {
      width: 420px;
      max-width: 100vw;
      height: 680px;
      max-height: 100vh;
      background: #e5ddd5;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }

    /* ── Header estilo WhatsApp ── */
    .chat-header {
      background: #075e54;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #25d366;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .chat-header .info h2 {
      color: #fff;
      font-size: 16px;
      font-weight: 600;
    }
    .chat-header .info p {
      color: #b2dfdb;
      font-size: 12px;
    }

    /* ── Fondo del chat ── */
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #e5ddd5 url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c5bdb5' fill-opacity='0.2'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    /* ── Burbujas ── */
    .bubble {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* Mensajes del bot — izquierda */
    .bubble.bot {
      background: #fff;
      align-self: flex-start;
      border-top-left-radius: 0;
      color: #303030;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }
    .bubble.bot::before {
      content: '';
      position: absolute;
      top: 0; left: -8px;
      border-width: 0 8px 8px 0;
      border-style: solid;
      border-color: transparent #fff transparent transparent;
    }

    /* Mensajes del usuario — derecha */
    .bubble.user {
      background: #dcf8c6;
      align-self: flex-end;
      border-top-right-radius: 0;
      color: #303030;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }
    .bubble.user::after {
      content: '';
      position: absolute;
      top: 0; right: -8px;
      border-width: 0 0 8px 8px;
      border-style: solid;
      border-color: transparent transparent transparent #dcf8c6;
    }

    .bubble .time {
      font-size: 11px;
      color: #999;
      text-align: right;
      margin-top: 4px;
    }

    /* Burbuja con enlace de verificación */
    .verify-link-bubble {
      background: #fff;
      align-self: flex-start;
      border-radius: 8px;
      border-top-left-radius: 0;
      max-width: 85%;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      animation: fadeIn 0.25s ease;
    }
    .verify-link-bubble .link-preview {
      border-left: 4px solid #25d366;
      padding: 8px 12px;
      background: #f0f0f0;
    }
    .verify-link-bubble .link-preview .link-title {
      font-size: 13px;
      font-weight: 600;
      color: #075e54;
      margin-bottom: 2px;
    }
    .verify-link-bubble .link-preview .link-desc {
      font-size: 12px;
      color: #666;
    }
    .verify-link-bubble .link-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #417FB2;
      color: #fff !important;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      transition: background 0.2s;
      letter-spacing: 0.3px;
    }
    .verify-link-bubble .link-btn:hover { background: #396E99; }
    .verify-link-bubble .msg-text { padding: 8px 12px 2px; font-size: 14px; color: #303030; }
    .verify-link-bubble .time { padding: 0 12px 6px; font-size: 11px; color: #999; text-align: right; }

    /* Indicador de escritura */
    .typing {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      border-top-left-radius: 0;
      align-self: flex-start;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      animation: fadeIn 0.2s ease;
    }
    .typing span {
      width: 7px; height: 7px; background: #999;
      border-radius: 50%; animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

    /* ── Input area ── */
    .chat-footer {
      background: #f0f0f0;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chat-footer input {
      flex: 1;
      padding: 10px 16px;
      border-radius: 24px;
      border: none;
      outline: none;
      font-size: 15px;
      background: #fff;
      color: #303030;
    }
    .chat-footer input::placeholder { color: #aaa; }
    .chat-footer button {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: #25d366;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .chat-footer button:hover { background: #128c7e; }
    .chat-footer button:disabled { background: #ccc; cursor: default; }

    /* Etiqueta de fecha */
    .date-label {
      text-align: center;
      font-size: 12px;
      color: #777;
      background: rgba(255,255,255,0.6);
      border-radius: 8px;
      padding: 4px 10px;
      align-self: center;
      margin: 4px 0;
    }

    /* ── Nota informativa arriba ── */
    .info-banner {
      width: 420px;
      max-width: 100vw;
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #555;
      text-align: center;
    }
    .info-banner b { color: #333; }
  </style>
</head>
<body>

  <div style="display:flex; flex-direction:column; align-items:center;">
    <div class="info-banner">
      <b>🧪 Simulador de ChatBot</b><br>
    </div>

    <div class="chat-window">
      <!-- Header -->
      <div class="chat-header">
        <div class="avatar">🤖</div>
        <div class="info">
          <h2>ChatBot Privado</h2>
          <p>en línea</p>
        </div>
      </div>

      <!-- Body del chat -->
      <div class="chat-body" id="chat-body">
        <div class="date-label">Hoy</div>
      </div>

      <!-- Input -->
      <div class="chat-footer">
        <input type="text" id="wa-input" placeholder="Escribe un mensaje..." />
        <button id="send-btn" onclick="handleSend()">➤</button>
      </div>
    </div>
  </div>

  <script>
    // ── Utilidades ──────────────────────────────────────────────
    function now() {
      return new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    }

    function appendBotBubble(text) {
      const body = document.getElementById('chat-body');
      const div = document.createElement('div');
      div.className = 'bubble bot';
      div.innerHTML = `${text}<div class="time">${now()}</div>`;
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
    }

    function appendUserBubble(text) {
      const body = document.getElementById('chat-body');
      const div = document.createElement('div');
      div.className = 'bubble user';
      div.innerHTML = `${text}<div class="time">${now()} ✓✓</div>`;
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
    }

    function showTyping() {
      const body = document.getElementById('chat-body');
      const div = document.createElement('div');
      div.className = 'typing';
      div.id = 'typing-indicator';
      div.innerHTML = '<span></span><span></span><span></span>';
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
      return div;
    }

    function removeTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function appendEnrollLink(waNumber) {
      const body = document.getElementById('chat-body');
      const enrollUrl = `${window.location.origin}/sample-apps/enroll/index.html?wa=${encodeURIComponent(waNumber)}`;

      const wrapper = document.createElement('table');
      wrapper.setAttribute('cellpadding', '0');
      wrapper.setAttribute('cellspacing', '0');
      wrapper.style.cssText = 'width:82%;max-width:340px;border-collapse:separate;border-radius:8px;border-top-left-radius:0;box-shadow:0 1px 2px rgba(0,0,0,0.15);background:#fff;align-self:flex-start;animation:fadeIn 0.25s ease;table-layout:fixed;';

      wrapper.innerHTML = `
        <tr>
          <td style="padding:10px 12px 6px;font-size:14px;color:#303030;line-height:1.4;background:#fff;border-radius:8px 8px 0 0;">
            📋 Aquí tienes tu enlace de registro:
          </td>
        </tr>
        <tr>
          <td style="background:#f0f0f0;border-left:4px solid #417FB2;padding:8px 12px;">
            <div style="font-size:13px;font-weight:600;color:#1a1a2e;margin-bottom:2px;">Registro Facial — ChatBot Privado</div>
            <div style="font-size:12px;color:#666;">Toca el botón azul para registrar tu rostro</div>
          </td>
        </tr>
        <tr>
          <td style="padding:0;border-radius:0 0 8px 8px;overflow:hidden;">
            <a href="${enrollUrl}" target="_blank"
               style="display:block;width:100%;padding:13px 12px;background:#417FB2;color:#fff;text-decoration:none;font-size:15px;font-weight:700;text-align:center;letter-spacing:0.3px;box-sizing:border-box;">
              📋 Registrar mi identidad →
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:3px 12px 6px;font-size:11px;color:#999;text-align:right;background:#fff;">
            ${now()}
          </td>
        </tr>
      `;

      body.appendChild(wrapper);
      body.scrollTop = body.scrollHeight;
    }

    function appendVerifyLink(waNumber) {
      const body = document.getElementById('chat-body');
      const verifyUrl = `${window.location.origin}/sample-apps/verify/index.html?wa=${encodeURIComponent(waNumber)}`;

      // Usar tabla para evitar el colapso de altura en flex column
      const wrapper = document.createElement('table');
      wrapper.setAttribute('cellpadding', '0');
      wrapper.setAttribute('cellspacing', '0');
      wrapper.style.cssText = 'width:82%;max-width:340px;border-collapse:separate;border-radius:8px;border-top-left-radius:0;box-shadow:0 1px 2px rgba(0,0,0,0.15);background:#fff;align-self:flex-start;animation:fadeIn 0.25s ease;table-layout:fixed;';

      wrapper.innerHTML = `
        <tr>
          <td style="padding:10px 12px 6px;font-size:14px;color:#303030;line-height:1.4;background:#fff;border-radius:8px 8px 0 0;">
            🔐 Aquí tienes tu enlace de verificación:
          </td>
        </tr>
        <tr>
          <td style="background:#f0f0f0;border-left:4px solid #25d366;padding:8px 12px;">
            <div style="font-size:13px;font-weight:600;color:#075e54;margin-bottom:2px;">Verificación Facial — ChatBot Privado</div>
            <div style="font-size:12px;color:#666;">Toca el botón azul para verificar tu identidad</div>
          </td>
        </tr>
        <tr>
          <td style="padding:0;border-radius:0 0 8px 8px;overflow:hidden;">
            <a href="${verifyUrl}" target="_blank"
               style="display:block;width:100%;padding:13px 12px;background:#417FB2;color:#fff;text-decoration:none;font-size:15px;font-weight:700;text-align:center;letter-spacing:0.3px;box-sizing:border-box;">
              🔐 Verificar mi identidad →
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:3px 12px 6px;font-size:11px;color:#999;text-align:right;background:#fff;">
            ${now()}
          </td>
        </tr>
      `;

      body.appendChild(wrapper);
      body.scrollTop = body.scrollHeight;
    }

    // ── Número de WhatsApp: viene del parámetro ?wa= o usa el valor por defecto ──
    const urlParams = new URLSearchParams(window.location.search);
    const waNumber  = (urlParams.get('wa') || '5731258657898').replace(/\D/g, '');

    // ── Flujo del chat ──────────────────────────────────────────
    // 0 = esperando primer mensaje del usuario
    // 1 = esperando elección (registrarme / verificarme)
    // 2 = conversación terminada
    let step = 0;

    function botSay(text, delay = 0) {
      return new Promise(resolve => {
        showTyping();
        setTimeout(() => {
          removeTyping();
          appendBotBubble(text);
          resolve();
        }, delay);
      });
    }

    function appendOptions() {
      const body = document.getElementById('chat-body');
      const div = document.createElement('div');
      div.id = 'options-bubble';
      div.style.cssText = 'align-self:flex-start;display:flex;flex-direction:column;gap:8px;margin-top:4px;animation:fadeIn 0.25s ease;';
      div.innerHTML = `
        <button onclick="handleOption('registrarme')"
          style="padding:10px 20px;background:#fff;border:2px solid #417FB2;border-radius:20px;
                 color:#417FB2;font-size:14px;font-weight:600;cursor:pointer;text-align:left;
                 transition:background 0.2s,color 0.2s;">
          📋 Registrarme
        </button>
        <button onclick="handleOption('verificarme')"
          style="padding:10px 20px;background:#417FB2;border:2px solid #417FB2;border-radius:20px;
                 color:#fff;font-size:14px;font-weight:600;cursor:pointer;text-align:left;
                 transition:background 0.2s,color 0.2s;">
          🔐 Verificarme
        </button>
      `;
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
    }

    async function handleOption(choice) {
      if (step !== 1) return;
      step = 2;

      // Quitar los botones de opción
      const optDiv = document.getElementById('options-bubble');
      if (optDiv) optDiv.remove();

      // Mostrar como burbuja del usuario
      const label = choice === 'registrarme' ? '📋 Registrarme' : '🔐 Verificarme';
      appendUserBubble(label);

      if (choice === 'registrarme') {
        await botSay('¡Perfecto! Generando tu enlace de registro facial... 📋', 1000);
        await botSay('¡Listo! Aquí tienes tu enlace de acceso 👇', 1000);
        appendEnrollLink(waNumber);
        await botSay('Toca el botón <b>azul</b> de arriba para registrar tu rostro. El proceso tarda menos de 1 minuto. 🕐', 1500);
      } else {
        await botSay('¡Perfecto! Generando tu enlace de verificación... 🔐', 1000);
        await botSay('¡Listo! Aquí tienes tu enlace de acceso 👇', 1000);
        appendVerifyLink(waNumber);
        await botSay('Toca el botón <b>azul</b> de arriba para verificar tu identidad. El proceso tarda menos de 1 minuto. 🕐', 1500);
      }
    }

    async function handleSend() {
      if (step !== 0) return;

      const input = document.getElementById('wa-input');
      const userText = input.value.trim();

      if (!userText) return;

      // Mostrar mensaje del usuario y bloquear input
      appendUserBubble(userText);
      input.value = '';
      input.disabled = true;
      document.getElementById('send-btn').disabled = true;
      step = 1;

      // Bot pregunta qué desea hacer
      await botSay('👋 ¡Hola! Bienvenido al <b>ChatBot Privado</b>.', 900);
      await botSay('Necesito saber si estás registrado. Elige entre las siguientes opciones:', 1600);
      appendOptions();
    }

    // Enviar con Enter
    document.getElementById('wa-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleSend();
    });

    // El input empieza activo — el usuario inicia la conversación
    document.getElementById('wa-input').focus();
  </script>
</body>
</html>
