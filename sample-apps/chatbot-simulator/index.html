<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ChatBot Privado — Simulador</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Helvetica, sans-serif; }

    body {
      background: #e5ddd5;
      display: flex;
      justify-content: center;
      align-items: flex-start; /* móvil: desde arriba */
      min-height: 100vh;
      min-height: 100dvh; /* dynamic viewport height en móvil */
    }

    /* ── Contenedor principal ── */
    .chat-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    /* ── Info banner ── */
    .info-banner {
      width: 100%;
      background: #fff3cd;
      border-bottom: 1px solid #ffc107;
      padding: 8px 16px;
      font-size: 13px;
      color: #555;
      text-align: center;
      flex-shrink: 0;
    }
    .info-banner b { color: #333; }

    /* ── Ventana del chat — mobile first ── */
    .chat-window {
      width: 100%;
      flex: 1;
      background: #e5ddd5;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Tablet (≥600px): ancho fijo centrado ── */
    @media (min-width: 600px) {
      body { align-items: center; }
      .chat-container {
        width: 480px;
        height: 100vh;
        height: 100dvh;
      }
      .info-banner {
        width: 480px;
        border-radius: 10px 10px 0 0;
        border: 1px solid #ffc107;
        border-bottom: none;
        margin-top: 16px;
        flex-shrink: 0;
      }
      .chat-window {
        flex: 1;
        border-radius: 0 0 12px 12px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.25);
        margin-bottom: 16px;
      }
    }

    /* ── Desktop (≥1024px): más espacio ── */
    @media (min-width: 1024px) {
      .chat-container {
        width: 440px;
        height: 100vh;
        height: 100dvh;
      }
      .info-banner {
        width: 440px;
        border-radius: 12px 12px 0 0;
        margin-top: 24px;
      }
      .chat-window {
        flex: 1;
        border-radius: 0 0 16px 16px;
        box-shadow: 0 12px 48px rgba(0,0,0,0.3);
        margin-bottom: 24px;
      }
    }

    /* ── Header estilo WhatsApp ── */
    .chat-header {
      background: #075e54;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .chat-header .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.3);
    }
    .chat-header .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .chat-header .info h2 {
      color: #fff;
      font-size: 15px;
      font-weight: 600;
    }
    .chat-header .info p {
      color: #b2dfdb;
      font-size: 12px;
    }

    /* ── Fondo del chat ── */
    .chat-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #e5ddd5 url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c5bdb5' fill-opacity='0.2'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    /* ── Burbujas ── */
    .bubble {
      max-width: 82%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.45;
      position: relative;
      animation: fadeIn 0.25s ease;
    }
    @media (min-width: 600px) { .bubble { font-size: 14px; max-width: 78%; } }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .bubble.bot {
      background: #fff;
      align-self: flex-start;
      border-top-left-radius: 0;
      color: #303030;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }
    .bubble.bot::before {
      content: '';
      position: absolute;
      top: 0; left: -8px;
      border-width: 0 8px 8px 0;
      border-style: solid;
      border-color: transparent #fff transparent transparent;
    }

    .bubble.user {
      background: #dcf8c6;
      align-self: flex-end;
      border-top-right-radius: 0;
      color: #303030;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }
    .bubble.user::after {
      content: '';
      position: absolute;
      top: 0; right: -8px;
      border-width: 0 0 8px 8px;
      border-style: solid;
      border-color: transparent transparent transparent #dcf8c6;
    }

    .bubble .time {
      font-size: 11px;
      color: #999;
      text-align: right;
      margin-top: 4px;
    }

    /* ── Burbuja con enlace ── */
    .verify-link-bubble {
      background: #fff;
      align-self: flex-start;
      border-radius: 8px;
      border-top-left-radius: 0;
      max-width: 85%;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      animation: fadeIn 0.25s ease;
    }
    .verify-link-bubble .link-preview {
      border-left: 4px solid #25d366;
      padding: 8px 12px;
      background: #f0f0f0;
    }
    .verify-link-bubble .link-preview .link-title {
      font-size: 13px;
      font-weight: 600;
      color: #075e54;
      margin-bottom: 2px;
    }
    .verify-link-bubble .link-preview .link-desc {
      font-size: 12px;
      color: #666;
    }
    .verify-link-bubble .link-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #417FB2;
      color: #fff !important;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      transition: background 0.2s;
      letter-spacing: 0.3px;
    }
    .verify-link-bubble .link-btn:hover { background: #396E99; }
    .verify-link-bubble .msg-text { padding: 8px 12px 2px; font-size: 14px; color: #303030; }
    .verify-link-bubble .time { padding: 0 12px 6px; font-size: 11px; color: #999; text-align: right; }

    /* ── Indicador de escritura ── */
    .typing {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      border-top-left-radius: 0;
      align-self: flex-start;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      animation: fadeIn 0.2s ease;
    }
    .typing span {
      width: 7px; height: 7px; background: #999;
      border-radius: 50%; animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

    /* ── Input area ── */
    .chat-footer {
      background: #f0f0f0;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      /* safe area para notch en iOS */
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }
    .chat-footer input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 24px;
      border: none;
      outline: none;
      font-size: 15px;
      background: #fff;
      color: #303030;
      min-width: 0; /* flex shrink correcto */
    }
    .chat-footer input::placeholder { color: #aaa; }
    .chat-footer button {
      width: 44px; height: 44px;
      min-width: 44px;
      border-radius: 50%;
      border: none;
      background: #25d366;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .chat-footer button:hover { background: #128c7e; }
    .chat-footer button:disabled { background: #ccc; cursor: default; }

    /* ── Etiqueta de fecha ── */
    .date-label {
      text-align: center;
      font-size: 12px;
      color: #777;
      background: rgba(255,255,255,0.6);
      border-radius: 8px;
      padding: 4px 10px;
      align-self: center;
      margin: 4px 0;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="info-banner">
      <b>🧪 Simulador de ChatBot</b>
    </div>

    <div class="chat-window">
      <!-- Header -->
      <div class="chat-header">
        <div class="avatar">
          <img src="../../core-sdk/FaceTec_images/logo-play.png" alt="Total Play">
        </div>
        <div class="info">
          <h2>Total Play <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" style="vertical-align:middle;margin-left:3px;" fill="#4fc3f7"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/><circle cx="12" cy="12" r="11" fill="none" stroke="#4fc3f7" stroke-width="2"/></svg></h2>
          <p>en línea</p>
        </div>
      </div>

      <!-- Body del chat -->
      <div class="chat-body" id="chat-body">
        <div class="date-label">Hoy</div>
      </div>

      <!-- Input -->
      <div class="chat-footer">
        <input type="text" id="wa-input" placeholder="Escribe un mensaje..." />
        <button id="send-btn" onclick="handleSend()">➤</button>
      </div>
    </div>
  </div>

  <script>
    function now() {
      return new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    }

    function appendBotBubble(text) {
      const body = document.getElementById('chat-body');
      const div = document.createElement('div');
      div.className = 'bubble bot';
      div.innerHTML = `${text}<div class="time">${now()}</div>`;
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
    }

    function appendUserBubble(text) {
      const body = document.getElementById('chat-body');
      const div = document.createElement('div');
      div.className = 'bubble user';
      div.innerHTML = `${text}<div class="time">${now()} ✓✓</div>`;
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
    }

    function showTyping() {
      const body = document.getElementById('chat-body');
      const div = document.createElement('div');
      div.className = 'typing';
      div.id = 'typing-indicator';
      div.innerHTML = '<span></span><span></span><span></span>';
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
      return div;
    }

    function removeTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function appendEnrollLink(waNumber) {
      const body = document.getElementById('chat-body');
      const enrollUrl = `${window.location.origin}/sample-apps/enroll/index.html?wa=${encodeURIComponent(waNumber)}`;

      const wrapper = document.createElement('table');
      wrapper.setAttribute('cellpadding', '0');
      wrapper.setAttribute('cellspacing', '0');
      wrapper.style.cssText = 'width:82%;max-width:340px;border-collapse:separate;border-radius:8px;border-top-left-radius:0;box-shadow:0 1px 2px rgba(0,0,0,0.15);background:#fff;align-self:flex-start;animation:fadeIn 0.25s ease;table-layout:fixed;';

      wrapper.innerHTML = `
        <tr>
          <td style="padding:10px 12px 6px;font-size:14px;color:#303030;line-height:1.4;background:#fff;border-radius:8px 8px 0 0;">
            📋 Aquí tienes tu enlace de registro:
          </td>
        </tr>
        <tr>
          <td style="background:#f0f0f0;border-left:4px solid #417FB2;padding:8px 12px;">
            <div style="font-size:13px;font-weight:600;color:#1a1a2e;margin-bottom:2px;">Registro Facial — Total Play</div>
            <div style="font-size:12px;color:#666;">Toca el botón azul para registrar tu rostro</div>
          </td>
        </tr>
        <tr>
          <td style="padding:0;border-radius:0 0 8px 8px;overflow:hidden;">
            <a href="${enrollUrl}"
               style="display:block;width:100%;padding:13px 12px;background:#417FB2;color:#fff;text-decoration:none;font-size:15px;font-weight:700;text-align:center;letter-spacing:0.3px;box-sizing:border-box;">
              📋 Registrar mi identidad →
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:3px 12px 6px;font-size:11px;color:#999;text-align:right;background:#fff;">
            ${now()}
          </td>
        </tr>
      `;

      body.appendChild(wrapper);
      body.scrollTop = body.scrollHeight;
    }

    function appendVerifyLink(waNumber) {
      const body = document.getElementById('chat-body');
      const verifyUrl = `${window.location.origin}/sample-apps/verify/index.html?wa=${encodeURIComponent(waNumber)}`;

      // Usar tabla para evitar el colapso de altura en flex column
      const wrapper = document.createElement('table');
      wrapper.setAttribute('cellpadding', '0');
      wrapper.setAttribute('cellspacing', '0');
      wrapper.style.cssText = 'width:82%;max-width:340px;border-collapse:separate;border-radius:8px;border-top-left-radius:0;box-shadow:0 1px 2px rgba(0,0,0,0.15);background:#fff;align-self:flex-start;animation:fadeIn 0.25s ease;table-layout:fixed;';

      wrapper.innerHTML = `
        <tr>
          <td style="padding:10px 12px 6px;font-size:14px;color:#303030;line-height:1.4;background:#fff;border-radius:8px 8px 0 0;">
            🔐 Aquí tienes tu enlace de verificación:
          </td>
        </tr>
        <tr>
          <td style="background:#f0f0f0;border-left:4px solid #25d366;padding:8px 12px;">
            <div style="font-size:13px;font-weight:600;color:#075e54;margin-bottom:2px;">Verificación Facial — Total Play</div>
            <div style="font-size:12px;color:#666;">Toca el botón azul para verificar tu identidad</div>
          </td>
        </tr>
        <tr>
          <td style="padding:0;border-radius:0 0 8px 8px;overflow:hidden;">
            <a href="${verifyUrl}"
               style="display:block;width:100%;padding:13px 12px;background:#417FB2;color:#fff;text-decoration:none;font-size:15px;font-weight:700;text-align:center;letter-spacing:0.3px;box-sizing:border-box;">
              🔐 Verificar mi identidad →
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:3px 12px 6px;font-size:11px;color:#999;text-align:right;background:#fff;">
            ${now()}
          </td>
        </tr>
      `;

      body.appendChild(wrapper);
      body.scrollTop = body.scrollHeight;
    }

    // ── Número de WhatsApp: viene del parámetro ?wa= o usa el valor por defecto ──
    const urlParams = new URLSearchParams(window.location.search);
    const waNumber  = (urlParams.get('wa') || '5731258657898').replace(/\D/g, '');
    const verified  = urlParams.get('verified') === 'true';

    // ── Flujo del chat ──────────────────────────────────────────
    // 0 = esperando primer mensaje del usuario
    // 1 = esperando elección (registrarme / verificarme)
    // 2 = conversación terminada
    let step = 0;

    function botSay(text, delay = 0) {
      return new Promise(resolve => {
        showTyping();
        setTimeout(() => {
          removeTyping();
          appendBotBubble(text);
          resolve();
        }, delay);
      });
    }

    function appendOptions() {
      const body = document.getElementById('chat-body');
      const div = document.createElement('div');
      div.id = 'options-bubble';
      div.style.cssText = 'align-self:flex-start;display:flex;flex-direction:column;gap:8px;margin-top:4px;animation:fadeIn 0.25s ease;';
      div.innerHTML = `
        <button onclick="handleOption('registrarme')"
          style="padding:10px 20px;background:#fff;border:2px solid #417FB2;border-radius:20px;
                 color:#417FB2;font-size:14px;font-weight:600;cursor:pointer;text-align:left;
                 transition:background 0.2s,color 0.2s;">
          📋 Registrarme
        </button>
        <button onclick="handleOption('verificarme')"
          style="padding:10px 20px;background:#417FB2;border:2px solid #417FB2;border-radius:20px;
                 color:#fff;font-size:14px;font-weight:600;cursor:pointer;text-align:left;
                 transition:background 0.2s,color 0.2s;">
          🔐 Verificarme
        </button>
      `;
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
    }

    async function handleOption(choice) {
      if (step !== 1) return;
      step = 2;

      // Quitar los botones de opción
      const optDiv = document.getElementById('options-bubble');
      if (optDiv) optDiv.remove();

      // Mostrar como burbuja del usuario
      const label = choice === 'registrarme' ? '📋 Registrarme' : '🔐 Verificarme';
      appendUserBubble(label);

      if (choice === 'registrarme') {
        await botSay('¡Perfecto! Generando tu enlace de registro facial... 📋', 1000);
        await botSay('¡Listo! Aquí tienes tu enlace de acceso 👇', 1000);
        appendEnrollLink(waNumber);
        await botSay('Toca el botón <b>azul</b> de arriba para registrar tu rostro. El proceso tarda menos de 1 minuto. 🕐', 1500);
      } else {
        await botSay('¡Perfecto! Generando tu enlace de verificación... 🔐', 1000);
        await botSay('¡Listo! Aquí tienes tu enlace de acceso 👇', 1000);
        appendVerifyLink(waNumber);
        await botSay('Toca el botón <b>azul</b> de arriba para verificar tu identidad. El proceso tarda menos de 1 minuto. 🕐', 1500);
      }
    }

    async function handleSend() {
      if (step !== 0) return;

      const input = document.getElementById('wa-input');
      const userText = input.value.trim();

      if (!userText) return;

      // Mostrar mensaje del usuario y bloquear input
      appendUserBubble(userText);
      input.value = '';
      input.disabled = true;
      document.getElementById('send-btn').disabled = true;
      step = 1;

      // Bot pregunta qué desea hacer
      await botSay('👋 ¡Hola! Bienvenido a <b>Total Play</b>.', 900);
      await botSay('Necesito saber si estás registrado. Elige entre las siguientes opciones:', 1600);
      appendOptions();
    }

    // Enviar con Enter
    document.getElementById('wa-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleSend();
    });

    function appendEndSessionButton() {
      const body = document.getElementById('chat-body');
      const div = document.createElement('div');
      div.id = 'end-session-bubble';
      div.style.cssText = 'align-self:flex-start;display:flex;flex-direction:column;gap:0;margin-top:4px;animation:fadeIn 0.25s ease;max-width:85%;';
      div.innerHTML = `
        <div style="background:#fff;padding:10px 14px 6px;border-radius:8px 8px 0 0;border-top-left-radius:0;font-size:14px;color:#303030;box-shadow:0 1px 2px rgba(0,0,0,0.10);">
          ¿Deseas iniciar una nueva sesión?
        </div>
        <button onclick="resetChat()"
          style="padding:11px 20px;background:#075e54;border:none;border-radius:0 0 8px 8px;
                 color:#fff;font-size:14px;font-weight:700;cursor:pointer;text-align:center;
                 width:100%;letter-spacing:0.3px;transition:background 0.2s;">
          ✅ De acuerdo
        </button>
      `;
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
    }

    function resetChat() {
      // Limpiar sessionStorage
      sessionStorage.removeItem(CHAT_KEY);
      sessionStorage.removeItem(CHAT_KEY + '_step');

      // Limpiar el chat visualmente
      const body = document.getElementById('chat-body');
      body.innerHTML = '<div class="date-label">Hoy</div>';

      // Resetear estado
      step = 0;

      // Rehabilitar input
      const input = document.getElementById('wa-input');
      input.disabled = false;
      input.value = '';
      document.getElementById('send-btn').disabled = false;
      input.focus();
    }

    // ── Persistencia del chat con sessionStorage ────────────────
    const CHAT_KEY = 'chatbot_history_' + waNumber;
    function saveChat() {
      const body = document.getElementById('chat-body');
      sessionStorage.setItem(CHAT_KEY, body.innerHTML);
      sessionStorage.setItem(CHAT_KEY + '_step', String(step));
    }

    function restoreChat() {
      const saved = sessionStorage.getItem(CHAT_KEY);
      const savedStep = sessionStorage.getItem(CHAT_KEY + '_step');
      if (saved) {
        const body = document.getElementById('chat-body');
        body.innerHTML = saved;
        // Eliminar botones de opción guardados (no son funcionales al restaurar)
        const opts = body.querySelector('#options-bubble');
        if (opts) opts.remove();
        body.scrollTop = body.scrollHeight;
        step = savedStep ? parseInt(savedStep) : 2;
        // Bloquear input si la conversación ya terminó
        if (step >= 2) {
          document.getElementById('wa-input').disabled = true;
          document.getElementById('send-btn').disabled = true;
        }
        return true;
      }
      return false;
    }

    // Guardar chat antes de salir a verify/enroll
    window.addEventListener('pagehide', saveChat);
    window.addEventListener('beforeunload', saveChat);

    // El input empieza activo — el usuario inicia la conversación
    document.getElementById('wa-input').focus();

    // ── Si viene de una verificación exitosa, mostrar bienvenida automática ──
    if (verified) {
      // Limpiar ?verified=true de la URL inmediatamente para evitar que
      // al presionar "atrás" desde verify se vuelvan a mostrar los mensajes
      const cleanUrl = window.location.origin + window.location.pathname + '?wa=' + encodeURIComponent(waNumber);
      history.replaceState(null, '', cleanUrl);
      // Restaurar conversación previa y agregar mensajes de bienvenida
      const hadHistory = restoreChat();
      sessionStorage.removeItem(CHAT_KEY);
      sessionStorage.removeItem(CHAT_KEY + '_step');

      step = 2;
      document.getElementById('wa-input').disabled = true;
      document.getElementById('send-btn').disabled = true;
      (async () => {
        await botSay('🔐 Verificación completada exitosamente.', 700);
        await botSay(`👋 ¡Hola <b>+${waNumber}</b>! Bienvenido a <b>Total Play</b>. 🎉`, 1400);
        await botSay('Tu identidad ha sido confirmada. Ya puedes acceder a todos los servicios. ✅', 2000);
        await botSay('La sesión de verificación ha finalizado. Gracias por usar nuestro sistema de identificación. 👋', 1800);
        appendEndSessionButton();
      })();
    }
    // Si no viene de verificación exitosa, el chat empieza vacío siempre
  </script>
</body>
</html>
